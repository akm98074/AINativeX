name: Deploy site to GitHub Pages

# Publishes the static site (repo root) to GitHub Pages.
# Runs on pushes to the launch branch, and can be triggered manually.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required by the official Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys; never cancel an in-progress one (cancelling mid-deploy can
# leave the live site on a stale commit).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages must already be enabled with Source = GitHub Actions
      # (Settings → Pages). Auto-enablement via `enablement: true` is not used:
      # the workflow token can't create a Pages site, so it fails the run.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site (no build step).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
